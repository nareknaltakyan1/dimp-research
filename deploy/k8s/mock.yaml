# Kubernetes rolling-update baseline: the contract mock server as a stateless
# Deployment behind a ClusterIP Service. The "upgrade" is a standard rolling
# update triggered by changing VERSION (v1 -> v2), which replaces pods.
# Used by scripts/k8s_rolling_baseline.sh.
apiVersion: v1
kind: Namespace
metadata:
  name: dimp-bench
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock
  namespace: dimp-bench
spec:
  replicas: 3
  selector:
    matchLabels: {app: mock}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  minReadySeconds: 0
  template:
    metadata:
      labels: {app: mock}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: mock
          image: dimp-mock:latest
          imagePullPolicy: Never
          args: ["-addr", ":8080"]
          env:
            - {name: VERSION, value: v1}
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 1
            failureThreshold: 1
          resources:
            requests: {cpu: 250m, memory: 32Mi}
            limits: {memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: mock
  namespace: dimp-bench
spec:
  selector: {app: mock}
  ports:
    - port: 80
      targetPort: 8080
