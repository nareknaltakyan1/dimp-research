# Good patch: shadow 5s, then 10% and 50% canary steps, one pod at a time.
apiVersion: dimp.research.io/v1alpha1
kind: HotPatch
metadata:
  name: s7-v2
  namespace: dimp-s7
spec:
  selector: {matchLabels: {app: s7-inplace}}
  version: v2
  artifact: {configMapRef: {name: patch-v2}}
  signatureRef: {name: patch-v2, key: manifest.sig}
  maxUnavailablePods: 1
  strategy:
    shadowDuration: 5s
    shadowSamples: 100
    steps:
      - {weight: 10, pause: 3s, minSamples: 10}
      - {weight: 50, pause: 3s, minSamples: 30}
    slo: {maxErrorRateDelta: "0.01", maxP99Factor: "2", p99SlackMs: 2, maxMismatchRate: "0"}
