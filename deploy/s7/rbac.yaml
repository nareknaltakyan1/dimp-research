apiVersion: v1
kind: Namespace
metadata:
  name: dimp-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hotpatch-operator
  namespace: dimp-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hotpatch-operator
rules:
  - apiGroups: [dimp.research.io]
    resources: [hotpatches]
    verbs: [get, list, watch]
  - apiGroups: [dimp.research.io]
    resources: [hotpatches/status]
    verbs: [get, update, patch]
  # Pods: read, annotate (running patch version), and set the readiness-gate condition.
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, patch]
  - apiGroups: [""]
    resources: [pods/status]
    verbs: [patch]
  # Artifacts are ConfigMaps (read only).
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch]
  - apiGroups: ["", events.k8s.io]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hotpatch-operator
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: hotpatch-operator}
subjects:
  - {kind: ServiceAccount, name: hotpatch-operator, namespace: dimp-system}
---
# Who may create HotPatch objects is the first line of defence: bind this
# role only to the release pipeline / platform team. (Code integrity does not
# depend on it: pods only run bundles signed by the trusted release key.)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hotpatch-publisher
rules:
  - apiGroups: [dimp.research.io]
    resources: [hotpatches]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create, get]
