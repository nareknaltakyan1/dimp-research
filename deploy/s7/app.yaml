apiVersion: v1
kind: Namespace
metadata:
  name: dimp-s7
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s7-inplace
  namespace: dimp-s7
spec:
  replicas: 3
  selector: {matchLabels: {app: s7-inplace}}
  template:
    metadata:
      labels: {app: s7-inplace}
    spec:
      # Spec-drift guard: a pod that restarts runs the IMAGE code (v1); it
      # becomes Ready only after the operator re-patched it to the fleet's
      # in-place version (or confirmed that no patch applies).
      readinessGates:
        - conditionType: dimp.research.io/patched
      containers:
        - name: app
          image: dimp/s7-inplace:dev
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
            - {name: admin, containerPort: 9090}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
          volumeMounts:
            - {name: keys, mountPath: /etc/dimp/keys, readOnly: true}
            - {name: token, mountPath: /etc/dimp/token, readOnly: true}
            # Persisted anti-rollback high-water mark (floor.json).
            - {name: state, mountPath: /var/lib/dimp}
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true}
      volumes:
        - name: keys
          configMap: {name: dimp-trusted-keys}
        - name: token
          secret: {secretName: dimp-admin-token, defaultMode: 0440}
        # emptyDir survives container restarts (crash, OOM) but not pod
        # deletion; a replacement pod starts at the image's version and is
        # bounded by -max-bundle-age plus the operator's re-patch (see doc).
        - name: state
          emptyDir: {sizeLimit: 1Mi}
      securityContext: {fsGroup: 10001}
---
apiVersion: v1
kind: Service
metadata:
  name: s7-inplace
  namespace: dimp-s7
spec:
  selector: {app: s7-inplace}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
# Only the operator may reach the admin port; clients get the API port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: s7-admin-only-operator
  namespace: dimp-s7
spec:
  podSelector: {matchLabels: {app: s7-inplace}}
  policyTypes: [Ingress]
  ingress:
    - ports: [{port: 8080, protocol: TCP}]
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: dimp-system}}
          podSelector: {matchLabels: {dimp.research.io/role: patch-operator}}
      ports: [{port: 9090, protocol: TCP}]
